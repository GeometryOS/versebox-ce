# 版本目录：与 InstallerX-Revived 的 UI 依赖栈对齐（同一套 Compose / Miuix / material3）。
# 只列出本工程真正用到的项；增删一律改这里，不要在模块里写死版本号。
# 与 D:\my213\InstallerX-Revived-main\gradle\libs.versions.toml 的对应关系见
# docs/ui-rework/01-构建基座/01-版本矩阵.md。

[versions]
# —— 构建工具链 ——
# Android Studio 的 AGP 兼容上限是 9.2.1（IDE 会直接拒绝导入更高版本），
# 而 miuix/compose 的 AAR 元数据只要求 >= 9.1.0，所以钉 9.2.1。
agp = "9.2.1"
kotlin = "2.4.21"
coroutines = "1.11.0"

# —— UI 依赖栈（与 InstallerX 同版本）——
# 注意：miuix / compose 1.12 / material3 1.5 的 AAR 元数据要求
# compileSdk >= 37 且 AGP >= 9.1.0，这是硬约束，不能靠"降级绕过"。
# miuix 必须用 SNAPSHOT（编在 material-color-utilities 6.0.0 上）：Central 的 0.9.4 正式版编在
# 5.0.1 上，没有 Cmf / Spec2026 / SPEC_2026，还会与 material-kolor 6.0.0 抢同一根 utilities 轴。
# 凭据：~/.gradle/gradle.properties 的 gpr.user / gpr.key，或 GITHUB_ACTOR / GITHUB_TOKEN（read:packages）。
miuix = "0.9.4-292d8ec6"
composeBom = "2026.09.00"
compose = "1.12.1"
material3 = "1.5.0-beta01"
materialIcons = "1.7.8"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
materialKolor = "6.0.0"
# 开放源代码许可页（aboutlibraries）：InstallerX 用的同一套版本
aboutLibraries = "15.3.0"
# 返回栈序列化 / 路由（miuix-nav 的 Saver 用 JSON）
ktxSerialization = "1.11.0"

# Android SDK
compileSdk = "37"
compileSdkMinor = "0"
targetSdk = "35"
minSdk = "28"

[plugins]
agp-app = { id = "com.android.application", version.ref = "agp" }
agp-lib = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# 纯 JVM 模块（:log-audit）用的 Kotlin 插件，与 app 的 Kotlin 版本保持一致
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutLibraries" }

[libraries]
# AndroidX / Compose
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# NavigationBackHandler / navigationevent：InstallerX 由这个工件传递引入，这里显式声明
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIcons" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# :log-audit 是纯 JVM 模块，用 core 而不是 android 变体
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
# :log-audit 的策略单测（纯 JVM，不需要设备）
junit4 = { module = "junit:junit", version = "4.13.2" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "ktxSerialization" }
# aboutlibraries：core 提供 Libs 数据模型，compose-m3 提供许可列表 UI
aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutLibraries" }
aboutlibraries-compose-m3 = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutLibraries" }
material-kolor = { module = "com.materialkolor:material-kolor-material3", version.ref = "materialKolor" }

# Miuix（Compose Multiplatform 的 MIUI 风格组件库）
miuix-core = { module = "top.yukonga.miuix.kmp:miuix-core-android", version.ref = "miuix" }
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui-android", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference-android", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons-android", version.ref = "miuix" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur-android", version.ref = "miuix" }
miuix-shader = { module = "top.yukonga.miuix.kmp:miuix-shader-android", version.ref = "miuix" }
# 导航容器（NavDisplay / NavDisplayEffects / NavTransition），InstallerX 用的就是它
miuix-navigation = { module = "top.yukonga.miuix.kmp:miuix-nav-android", version.ref = "miuix" }
