# ！！！旧格式兼容描述（versebox-rom/1），**已停止演进** ！！！
#
# 这个文件只服务「APK 的 assets 里直接带 rootfs」这条旧路径（RomCatalog 用它列出旧格式 ROM）。
# 新格式 ROM 包的「身份」在运行时仓库：guest-runtime-a15/rom/rom.properties.yaml，
# 由 rom/pack-rom.py 生成 zip 根里的 versebox_properties.yaml。
# 不要在这里加字段、也不要让打包脚本读它。阶段 7 收敛时整个 assets/roms/ 会被删除。
# Android 15 客体的描述文件。
# guest-runtime-a15 只提供 assets/jniLibs 产物；运行期 Java 启动层仍在
# guest-runtime 模块里，由 assets/guest-runtime-a15-inputs.json 的
# runtimeProfile（bootEntry=A15Boot、checkClass=io.a10vm.guest.RuntimeCheck）选择。
schema: versebox-rom/1
id: android15
name: Android 15
androidVersion: "15"
apiLevel: 35
assetPrefix: guest-runtime-a15/
runtimeManifest: guest-runtime-a15-inputs.json
displayManifest: native-display-inputs.json
description: 独立 API 35 用户空间（Redroid 15 64bit-only + AOSP 15 自建运行时）
