name: app build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装 Android SDK 组件
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          SDK=$(sed -n 's/^compileSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml | head -n1)
          MINOR=$(sed -n 's/^compileSdkMinor = "\(.*\)"/\1/p' gradle/libs.versions.toml | head -n1)
          echo "需求：compileSdk=$SDK minor=$MINOR"
          echo y | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          if ls "$ANDROID_HOME/platforms" 2>/dev/null | grep -q "^android-$SDK"; then
            echo "平台已安装，跳过下载"
          else
            for pkg in "platforms;android-$SDK.$MINOR" "platforms;android-$SDK"; do
              "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --channel=3 --install "$pkg" >/dev/null 2>&1 || true
              "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "$pkg" >/dev/null 2>&1 || true
            done
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "build-tools;35.0.0" "ndk;29.0.14206865" >/dev/null
          ls "$ANDROID_HOME/platforms" | grep -q "^android-$SDK" || {
            echo "安装后仍缺少 platforms;android-$SDK" >&2; ls "$ANDROID_HOME/platforms" >&2; exit 1;
          }
          echo "SDK 就绪"
      - name: 运行模块单元测试
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --stacktrace \
            :log-audit:test :vm-display:test :vm-rom:test -PciSkipNativeVerify=true
      - name: 汇总测试结果
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, sys
          files = glob.glob('**/build/test-results/**/TEST-*.xml', recursive=True)
          total = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for path in files:
              root = ET.parse(path).getroot()
              for key in total:
                  total[key] += int(root.attrib.get(key, 0))
          print('测试汇总：%d 个套件，%d 项，失败 %d，错误 %d，跳过 %d' % (
              len(files), total['tests'], total['failures'], total['errors'], total['skipped']))
          if not files:
              sys.exit('没有产生任何 JUnit XML')
          if total['failures'] or total['errors']:
              sys.exit('存在失败用例')
          PY
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-results
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: warn

  rom-stage:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装 Android SDK 组件
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          SDK=$(sed -n 's/^compileSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml | head -n1)
          MINOR=$(sed -n 's/^compileSdkMinor = "\(.*\)"/\1/p' gradle/libs.versions.toml | head -n1)
          echo "需求：compileSdk=$SDK minor=$MINOR"
          echo y | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          if ls "$ANDROID_HOME/platforms" 2>/dev/null | grep -q "^android-$SDK"; then
            echo "平台已安装，跳过下载"
          else
            for pkg in "platforms;android-$SDK.$MINOR" "platforms;android-$SDK"; do
              "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --channel=3 --install "$pkg" >/dev/null 2>&1 || true
              "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "$pkg" >/dev/null 2>&1 || true
            done
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "build-tools;35.0.0" "ndk;29.0.14206865" >/dev/null
          ls "$ANDROID_HOME/platforms" | grep -q "^android-$SDK" || {
            echo "安装后仍缺少 platforms;android-$SDK" >&2; ls "$ANDROID_HOME/platforms" >&2; exit 1;
          }
          echo "SDK 就绪"
      - name: 解析 ROM 配置并校验清单
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --stacktrace \
            :app:stageRomAssets -PverseboxRomStrict=true -PciSkipNativeVerify=true
          python3 - <<'PY'
          import json, pathlib, sys
          index = pathlib.Path('app/build/rom-dist/index.json')
          if not index.is_file():
              sys.exit('没有生成 app/build/rom-dist/index.json')
          entries = json.loads(index.read_text(encoding='utf-8')).get('entries', [])
          if not entries:
              sys.exit('没有选中任何 ROM，拒绝构建空 APK')
          keys = [e.get('id','') + '@' + e.get('romVersion','') for e in entries]
          if len(keys) != len(set(keys)):
              sys.exit('romKey 重复：' + ', '.join(keys))
          print('选中 ROM：' + ', '.join(keys))
          PY
      - name: 上传 ROM staging
        uses: actions/upload-artifact@v4
        with:
          name: build-rom-staging
          path: |
            app/build/rom-dist/apk-libs
            app/build/generated/rom-assets
          if-no-files-found: error

  debug:
    needs: rom-stage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装 Android SDK 组件
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          SDK=$(sed -n 's/^compileSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml | head -n1)
          MINOR=$(sed -n 's/^compileSdkMinor = "\(.*\)"/\1/p' gradle/libs.versions.toml | head -n1)
          echo "需求：compileSdk=$SDK minor=$MINOR"
          echo y | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          if ls "$ANDROID_HOME/platforms" 2>/dev/null | grep -q "^android-$SDK"; then
            echo "平台已安装，跳过下载"
          else
            for pkg in "platforms;android-$SDK.$MINOR" "platforms;android-$SDK"; do
              "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --channel=3 --install "$pkg" >/dev/null 2>&1 || true
              "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "$pkg" >/dev/null 2>&1 || true
            done
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "build-tools;35.0.0" "ndk;29.0.14206865" >/dev/null
          ls "$ANDROID_HOME/platforms" | grep -q "^android-$SDK" || {
            echo "安装后仍缺少 platforms;android-$SDK" >&2; ls "$ANDROID_HOME/platforms" >&2; exit 1;
          }
          echo "SDK 就绪"
      - name: 取回 ROM staging
        uses: actions/download-artifact@v4
        with:
          name: build-rom-staging
          path: app/build
      - name: 构建 Debug APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --stacktrace \
            :app:assembleDebug -x :app:stageRomAssets \
            -PverseboxRomStrict=true -PciSkipNativeVerify=true
      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  audit:
    needs: debug
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 取回 Debug APK
        uses: actions/download-artifact@v4
        with:
          name: build-debug-apk
          path: apk
      - name: 审计 APK 内容
        run: |
          set -euo pipefail
          apk=$(find apk -name '*.apk' | head -n1)
          test -n "$apk"
          echo "APK：$apk"
          echo "大小：$(stat -c%s "$apk") 字节"
          sha256sum "$apk"
          unzip -l "$apk" | grep -q 'assets/kanadex-rom/index.json' || { echo 'APK 缺少 ROM index' >&2; exit 1; }
          unzip -p "$apk" assets/kanadex-rom/index.json > index.json
          python3 - <<'PY'
          import json, sys
          entries = json.load(open('index.json', encoding='utf-8')).get('entries', [])
          if not entries:
              sys.exit('ROM index 为空')
          keys = [e.get('id','') + '@' + e.get('romVersion','') for e in entries]
          if len(keys) != len(set(keys)):
              sys.exit('romKey 重复：' + ', '.join(keys))
          print('内置 ROM：' + ', '.join(keys))
          PY
          libs=$(unzip -l "$apk" | grep -c 'lib/arm64-v8a/.*\.so' || true)
          echo "APK 内 .so 数量：$libs"
          test "$libs" -gt 0 || { echo 'APK 的 lib/ 为空，装机必失败' >&2; exit 1; }
