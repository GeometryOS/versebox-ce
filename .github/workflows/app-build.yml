name: app build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  # app-tests 作为可复用工作流被调用，Checks 列表的写权限要由调用方提供
  checks: write

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/app-tests.yml

  rom-stage:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - name: 解析 ROM 配置并校验清单
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            :app:stageRomAssets -PverseboxRomStrict=true -PciSkipNativeVerify=true
      - name: 上传 ROM staging
        uses: actions/upload-artifact@v4
        with:
          name: build-rom-staging
          path: |
            app/build/rom-dist/apk-libs
            app/build/generated/rom-assets
          if-no-files-found: error

  debug:
    needs: rom-stage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - name: 取回 ROM staging
        uses: actions/download-artifact@v4
        with:
          name: build-rom-staging
          path: app/build
      - name: 构建 Debug APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            :app:assembleDebug -x :app:stageRomAssets \
            -PverseboxRomStrict=true -PciSkipNativeVerify=true
      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  audit:
    needs: debug
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 取回 Debug APK
        uses: actions/download-artifact@v4
        with:
          name: build-debug-apk
          path: apk
      - name: 审计 APK 内容
        run: |
          set -euo pipefail
          apk=$(find apk -name '*.apk' | head -n1)
          test -n "$apk"
          echo "APK：$apk"
          echo "大小：$(stat -c%s "$apk") 字节"
          sha256sum "$apk"
          unzip -l "$apk" | grep -q 'assets/kanadex-rom/index.json' || { echo 'APK 缺少 assets/kanadex-rom/index.json' >&2; exit 1; }
          libs=$(unzip -l "$apk" | grep -c 'lib/arm64-v8a/.*\.so' || true)
          echo "APK 内 .so 数量：$libs"
          test "$libs" -gt 0 || { echo 'APK 的 lib/arm64-v8a 为空，装机必失败' >&2; exit 1; }
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libversebox_kanadex_logo.so' || { echo 'APK 缺少Rust品牌Logo动态库' >&2; exit 1; }
