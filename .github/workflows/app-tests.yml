name: app tests

# 只作为可复用入口与手动入口，不再自己监听 push/PR：
# push 的唯一入口是 app-build，由它调用本工作流，保证同一条测试命令每次提交只跑一遍。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  # 把 JUnit XML 发布成可展开的 Checks 结果；fork PR 会被降级为只读，展示步骤不阻断门禁
  checks: write

concurrency:
  group: app-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 纯 JVM 策略库：不碰 Android 运行时，失败面是版本比较、分组与文案契约。
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      # 单测是离线 job：不读网络、不注入令牌。:app:testDebugUnitTest 经 preBuild 会拉起
      # :app:stageRomAssets，漏掉 -x 就等于在无令牌的 runner 上拉 ROM，必然 403。
      # 这里故意不给令牌：谁再把 staging 拉进单测，应当立刻失败，而不是静默下载 GB 级产物。
      - name: 运行策略库单元测试
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            :log-audit:test :vm-display:test :vm-rom:test \
            -x :app:stageRomAssets -x :app:verifyRomAssets -PciSkipNativeVerify=true
      - uses: ./.github/actions/test-report
        with:
          artifact-name: app-test-results-policy

  # Android 侧：Robolectric 夹具 + Rust 品牌动效契约，失败面是 ROM 仓库、SQLite 与渲染时序。
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - name: 验证Rust品牌Logo动效
        run: cargo test --manifest-path app/src/main/rust/Cargo.toml --locked --offline
      - name: 运行Android侧单元测试
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            :guest-runtime:testDebugUnitTest :app:testDebugUnitTest \
            -x :app:stageRomAssets -x :app:verifyRomAssets -PciSkipNativeVerify=true
      - uses: ./.github/actions/test-report
        with:
          artifact-name: app-test-results-android
