name: app tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: app-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      # 单测是离线 job：不读网络、不注入令牌。ROM staging 要访问三个运行时仓库的 Release，
      # 属于 app-build 的 rom-stage job。:app:testDebugUnitTest 经 preBuild 会拉起
      # :app:stageRomAssets，漏掉 -x 就等于在无令牌的 runner 上拉 ROM，必然 403。
      # 这里故意不给令牌：谁再把 staging 拉进单测，应当立刻失败，而不是静默下载 GB 级产物。
      - name: 运行模块单元测试
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            :log-audit:test :vm-display:test :vm-rom:test :guest-runtime:testDebugUnitTest :app:testDebugUnitTest \
            -x :app:stageRomAssets -x :app:verifyRomAssets -PciSkipNativeVerify=true
      - name: 汇总测试结果
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, sys
          files = glob.glob('**/build/test-results/**/TEST-*.xml', recursive=True)
          total = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for path in files:
              root = ET.parse(path).getroot()
              for key in total:
                  total[key] += int(root.attrib.get(key, 0))
          print('测试汇总：%d 个套件，%d 项，失败 %d，错误 %d，跳过 %d' % (
              len(files), total['tests'], total['failures'], total['errors'], total['skipped']))
          if not files:
              sys.exit('没有产生任何 JUnit XML')
          if total['failures'] or total['errors']:
              sys.exit('存在失败用例')
          PY
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: warn
