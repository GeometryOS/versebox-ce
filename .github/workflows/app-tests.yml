name: VerseBox app tests

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install app SDK requirements
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-37" "build-tools;35.0.0" "ndk;29.0.14206865"
      - name: Run JVM and Android unit tests
        run: |
          ./gradlew --no-daemon --stacktrace --console=plain \
            :log-audit:test :vm-display:test :vm-rom:test \
            -PciSkipNativeVerify=true
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('**/build/test-results/**/TEST-*.xml', recursive=True)
          totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print('Test summary: %d suites, %d tests, %d failures, %d errors, %d skipped' %
                (len(files), totals['tests'], totals['failures'], totals['errors'], totals['skipped']))
          if not files:
              raise SystemExit('No Gradle test result XML was produced')
          PY
      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn
