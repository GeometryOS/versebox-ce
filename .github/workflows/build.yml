name: Build VerseBox app

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/app-tests.yml

  rom-stage:
    needs: tests
    uses: ./.github/workflows/app-rom-stage.yml

  debug-build:
    needs: [tests, rom-stage]
    uses: ./.github/workflows/app-debug-build.yml
