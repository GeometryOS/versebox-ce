name: app rom stage

on:
  workflow_run:
    workflows: ["app tests"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: app-rom-stage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装 Android SDK 组件
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          SDK=$(sed -n 's/^compileSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml | head -n1)
          MINOR=$(sed -n 's/^compileSdkMinor = "\(.*\)"/\1/p' gradle/libs.versions.toml | head -n1)
          echo "需求：compileSdk=$SDK minor=$MINOR"
          echo y | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          if ls "$ANDROID_HOME/platforms" 2>/dev/null | grep -q "^android-$SDK"; then
            echo "平台已安装，跳过下载"
          else
            for pkg in "platforms;android-$SDK.$MINOR" "platforms;android-$SDK"; do
              "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --channel=3 --install "$pkg" >/dev/null 2>&1 || true
              "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "$pkg" >/dev/null 2>&1 || true
            done
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "build-tools;35.0.0" "ndk;29.0.14206865" >/dev/null
          ls "$ANDROID_HOME/platforms" | grep -q "^android-$SDK" || {
            echo "安装后仍缺少 platforms;android-$SDK" >&2
            ls "$ANDROID_HOME/platforms" >&2
            exit 1
          }
          echo "SDK 就绪"
      - name: 解析 ROM 配置并校验清单
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --stacktrace \
            :app:stageRomAssets -PverseboxRomStrict=true -PciSkipNativeVerify=true
          python3 - <<'PY'
          import json, pathlib, sys
          index = pathlib.Path('app/build/rom-dist/index.json')
          if not index.is_file():
              sys.exit('没有生成 app/build/rom-dist/index.json')
          entries = json.loads(index.read_text(encoding='utf-8')).get('entries', [])
          if not entries:
              sys.exit('没有选中任何 ROM，拒绝构建空 APK')
          keys = [e.get('id','') + '@' + e.get('romVersion','') for e in entries]
          if len(keys) != len(set(keys)):
              sys.exit('romKey 重复：' + ', '.join(keys))
          print('选中 ROM：' + ', '.join(keys))
          PY
      - name: 上传 ROM staging
        uses: actions/upload-artifact@v4
        with:
          name: app-rom-staging
          path: |
            app/build/rom-dist/apk-libs
            app/build/generated/rom-assets
          if-no-files-found: error
