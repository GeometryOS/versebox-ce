name: VerseBox debug APK

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install app SDK requirements
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-37" "build-tools;35.0.0" "ndk;29.0.14206865"
      - name: Download selected ROM staging
        uses: actions/download-artifact@v4
        with:
          name: app-rom-staging
          path: app/build
      - name: Assemble debug APK
        run: |
          ./gradlew --no-daemon --stacktrace --console=plain \
            :app:assembleDebug -x :app:stageRomAssets \
            -PverseboxRomStrict=true -PciSkipNativeVerify=true
      - name: Verify APK and embedded ROM index
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'assets/kanadex-rom/index.json'
          sha256sum "$apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: versebox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
